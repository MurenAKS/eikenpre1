<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eiken Pre-1st Mastery Pro</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            background-color: var(--primary-color);
            color: white;
            border-radius: 0 0 15px 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Dictionary Section */
        .dictionary-box {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .dict-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .dict-tab {
            flex: 1;
            padding: 8px;
            border: none;
            background: #eee;
            cursor: pointer;
            border-radius: 5px;
        }

        .dict-tab.active {
            background: var(--secondary-color);
            color: white;
        }

        .dict-input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        /* Menu Section */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .menu-card {
            background: var(--card-bg);
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 2px solid transparent;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            border-color: var(--secondary-color);
        }

        .menu-card h3 { margin-top: 0; color: var(--primary-color); }

        /* Quiz Section */
        .quiz-container { display: none; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .passage { background: #f9f9f9; padding: 15px; border-left: 5px solid var(--secondary-color); margin-bottom: 20px; font-size: 1.1em; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
        .option-btn { padding: 15px; border: 2px solid #ddd; border-radius: 10px; background: white; cursor: pointer; text-align: left; font-size: 1rem; }
        .option-btn:hover { background: #f0f8ff; }
        .option-btn.correct { background: #d4edda; border-color: #28a745; }
        .option-btn.wrong { background: #f8d7da; border-color: #dc3545; }

        /* Controls */
        .btn { padding: 12px 24px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: var(--secondary-color); color: white; }
        .btn-nav { background: #6c757d; color: white; margin-top: 20px; }
        .speaker-btn { background: #673ab7; color: white; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        #explanation-box { margin-top: 20px; padding: 15px; border-radius: 10px; display: none; }
        .explanation-correct { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }

        /* Loading Spinner */
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--secondary-color); border-radius: 50%; width: 20px; height: 20px; animation: spin 2s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Eiken Pre-1st Mastery</h1>
        <p>英検準1級 完全対策 Web App</p>
    </header>

    <!-- 辞書機能 -->
    <section class="dictionary-box">
        <div class="dict-tabs">
            <button class="dict-tab active" onclick="setDictMode('en-ja')">英日</button>
            <button class="dict-tab" onclick="setDictMode('ja-en')">日英</button>
            <button class="dict-tab" onclick="setDictMode('en-en')">英英</button>
        </div>
        <div class="dict-input-group">
            <input type="text" id="dict-query" placeholder="単語を入力...">
            <button class="btn btn-primary" onclick="searchDictionary()">検索</button>
        </div>
        <div id="dict-result" style="margin-top:10px; font-size: 0.9em; max-height: 150px; overflow-y: auto;"></div>
    </section>

    <!-- メインメニュー -->
    <div id="main-menu" class="menu-grid">
        <div class="menu-card" onclick="startQuiz('vocabulary')">
            <h3>① 語彙力問題</h3>
            <p>短文の空欄補充<br>(Vocabulary)</p>
        </div>
        <div class="menu-card" onclick="startQuiz('reading')">
            <h3>② 長文読解</h3>
            <p>パッセージ読解<br>(Reading)</p>
        </div>
        <div class="menu-card" onclick="startQuiz('listening')">
            <h3>③ リスニング</h3>
            <p>音声クイズ<br>(Listening)</p>
        </div>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" class="quiz-container">
        <div id="quiz-header" style="display:flex; justify-content:space-between; align-items:center;">
            <span id="question-progress">Q 1/10</span>
            <button class="btn btn-nav" onclick="backToMenu()">終了</button>
        </div>

        <hr>

        <div id="audio-controls" class="hidden">
            <button class="btn speaker-btn" onclick="playAudio()">
                <span>🔊</span> 英文を再生する
            </button>
        </div>

        <div id="passage-text" class="passage hidden"></div>
        <div id="question-text" style="font-weight:bold; font-size:1.2em; margin-bottom:20px;"></div>

        <div id="options-area" class="options-grid"></div>

        <div id="explanation-box">
            <strong>【解説・和訳】</strong>
            <p id="explanation-text"></p>
            <button class="btn btn-primary" onclick="nextQuestion()">次の問題へ</button>
        </div>
    </div>
</div>

<script>
    /**
     * 問題データ配列 (EIKEN_PRE1_QUESTIONS)
     * カテゴリ: vocabulary, reading, listening
     */
    const EIKEN_PRE1_QUESTIONS = [
        {
            category: "vocabulary",
            text: "The new government policy was designed to (  ) the effects of the economic recession.",
            options: ["mitigate", "exacerbate", "relinquish", "contemplate"],
            answer: 0,
            explanation: "正解: mitigate (和らげる、軽減する)。政府の新政策は景気後退の影響を「軽減する」ために設計されました。exacerbate(悪化させる)、relinquish(放棄する)、contemplate(熟考する)。"
        },
        {
            category: "vocabulary",
            text: "She has an (  ) ability to predict market trends before they happen.",
            options: ["uncanny", "obsolete", "ambiguous", "superficial"],
            answer: 0,
            explanation: "正解: uncanny (並外れた、不可思議な)。市場動向を予測する「並外れた」能力を持っているという意味になります。"
        },
        {
            category: "reading",
            passage: "The Anthropocene is a proposed geological epoch dating from the commencement of significant human impact on Earth's geology and ecosystems. While the term is widely used in scientific circles, the exact starting date remains a subject of intense debate among geologists.",
            text: "What is the main point of the passage regarding the Anthropocene?",
            options: [
                "It is a period defined by human influence.",
                "Its starting date has been officially finalized.",
                "It has no impact on Earth's ecosystems.",
                "Geologists have decided to stop using the term."
            ],
            answer: 0,
            explanation: "正解: It is a period defined by human influence. 第1文に「人間の影響が地球の地質や生態系に及ぼし始めた時期」と定義されています。"
        },
        {
            category: "listening",
            text: "The manager was disappointed because the sales figures for this quarter were far below the initial projections.",
            question: "Why was the manager unhappy?",
            options: [
                "The projections were too high.",
                "The sales results were lower than expected.",
                "The quarter was too short.",
                "The staff did not follow the plan."
            ],
            answer: 1,
            explanation: "正解: The sales results were lower than expected. (売上が期待を下回ったため) 「below the initial projections(当初の予測を下回る)」が言い換えられています。"
        },
        {
            category: "vocabulary",
            text: "The company's decision to move its factory overseas was (  ) by a desire to reduce labor costs.",
            options: ["curtailed", "instigated", "prompted", "deviated"],
            answer: 2,
            explanation: "正解: prompted (〜を促した/引き起こした)。労働コスト削減の欲求によって「促された」という意味。"
        }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let dictMode = 'en-ja';

    // --- 辞書機能 ---
    function setDictMode(mode) {
        dictMode = mode;
        document.querySelectorAll('.dict-tab').forEach(btn => {
            btn.classList.remove('active');
            if(btn.innerText.includes(mode === 'en-ja' ? '英日' : mode === 'ja-en' ? '日英' : '英英')) {
                btn.classList.add('active');
            }
        });
    }

    async function searchDictionary() {
        const query = document.getElementById('dict-query').value.trim();
        const resultDiv = document.getElementById('dict-result');
        if (!query) return;

        resultDiv.innerHTML = '<span class="loader"></span> 検索中...';

        try {
            if (dictMode === 'en-en') {
                const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${query}`);
                const data = await res.json();
                if (data.title) throw new Error("Not found");
                const def = data[0].meanings[0].definitions[0].definition;
                resultDiv.innerHTML = `<strong>${query}:</strong> ${def}`;
            } else {
                // ExcelAPI (CORS許可済みの無料翻訳APIを利用)
                const url = `https://api.excelapi.org/translate/${dictMode}?text=${encodeURIComponent(query)}`;
                const res = await fetch(url);
                const text = await res.text();
                resultDiv.innerHTML = `<strong>${query}:</strong> ${text}`;
            }
        } catch (err) {
            resultDiv.innerHTML = "見つかりませんでした。";
        }
    }

    // --- クイズロジック ---
    function startQuiz(category) {
        currentQuestions = EIKEN_PRE1_QUESTIONS.filter(q => q.category === category);
        if (currentQuestions.length === 0) {
            alert("該当カテゴリーの問題は準備中です。");
            return;
        }
        currentIndex = 0;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        showQuestion();
    }

    function showQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById('question-progress').innerText = `Q ${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById('explanation-box').style.display = 'none';
        
        // リスニング設定
        if (q.category === 'listening') {
            document.getElementById('audio-controls').classList.remove('hidden');
            document.getElementById('question-text').innerText = q.question || "音声を聞いて答えてください。";
            document.getElementById('passage-text').classList.add('hidden');
        } else if (q.category === 'reading') {
            document.getElementById('audio-controls').classList.add('hidden');
            document.getElementById('passage-text').classList.remove('hidden');
            document.getElementById('passage-text').innerText = q.passage;
            document.getElementById('question-text').innerText = q.text;
        } else {
            document.getElementById('audio-controls').classList.add('hidden');
            document.getElementById('passage-text').classList.add('hidden');
            document.getElementById('question-text').innerText = q.text;
        }

        const optionsArea = document.getElementById('options-area');
        optionsArea.innerHTML = '';
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `${idx + 1}. ${opt}`;
            btn.onclick = () => checkAnswer(idx, btn);
            optionsArea.appendChild(btn);
        });
    }

    function checkAnswer(selectedIdx, btn) {
        const q = currentQuestions[currentIndex];
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        if (selectedIdx === q.answer) {
            btn.classList.add('correct');
        } else {
            btn.classList.add('wrong');
            buttons[q.answer].classList.add('correct');
        }

        const expBox = document.getElementById('explanation-box');
        expBox.style.display = 'block';
        expBox.className = 'explanation-correct';
        document.getElementById('explanation-text').innerText = q.explanation;
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            showQuestion();
        } else {
            alert("全ての練習問題を完了しました！");
            backToMenu();
        }
    }

    function backToMenu() {
        document.getElementById('main-menu').style.display = 'grid';
        document.getElementById('quiz-screen').style.display = 'none';
        window.speechSynthesis.cancel(); // 音声停止
    }

    // --- Web Speech API (音声再生) ---
    function playAudio() {
        const q = currentQuestions[currentIndex];
        const textToSpeak = q.category === 'listening' ? q.text : "";
        if (!textToSpeak) return;

        // ブラウザの既存音声を停止
        window.speechSynthesis.cancel();

        const uttr = new SpeechSynthesisUtterance(textToSpeak);
        
        // 音声リストから en-US または en-GB を探す
        const voices = window.speechSynthesis.getVoices();
        const enVoice = voices.find(v => v.lang === 'en-US' || v.lang.startsWith('en-'));
        if (enVoice) uttr.voice = enVoice;

        uttr.lang = 'en-US';
        uttr.rate = 0.9; // 準1級なら少し自然かつ聞き取りやすい速度
        uttr.pitch = 1.0;

        window.speechSynthesis.speak(uttr);
    }

    // ページ読み込み時に音声を初期化（ブラウザによっては必要）
    window.speechSynthesis.getVoices();
</script>

</body>
              </html>
