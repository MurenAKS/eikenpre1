<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI採点・解説システム</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-p-4 flex flex-col items-center min-h-screen">

    <div class="w-full max-w-2xl bg-white shadow-md rounded-lg p-6 my-8">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">AI採点・解説システム</h1>

        <!-- APIキー入力 -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1" for="apiKey">Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- 問題文入力 -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1" for="question">問題文</label>
            <textarea id="question" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="例: 日本の首都はどこですか？また、その特徴を簡潔に述べよ。"></textarea>
        </div>

        <!-- 解答入力 -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1" for="answer">あなたの解答</label>
            <textarea id="answer" rows="4" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="例: 東京です。人口が集中しており経済の中心地です。"></textarea>
        </div>

        <!-- 採点ボタン -->
        <button id="evaluateBtn" onclick="startEvaluation()" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition font-medium">
            AIに採点・解説を依頼する
        </button>

        <!-- ローディング・状態表示 -->
        <div id="statusIndicator" class="hidden mt-4 text-center text-blue-500 font-medium animate-pulse">
            AIが答案を解析・ストリーミング生成中...
        </div>

        <!-- 結果表示エリア -->
        <div id="resultContainer" class="hidden mt-6 border-t pt-6">
            <h2 class="text-xl font-semibold mb-3 text-slate-800">採点結果・解説</h2>
            <div id="resultContent" class="prose max-w-none bg-slate-50 p-4 rounded-md border border-slate-200 text-slate-700 leading-relaxed"></div>
            
            <!-- 音声読み上げボタン -->
            <div class="mt-4 flex gap-3">
                <button id="speakBtn" onclick="toggleSpeech()" class="bg-emerald-600 text-white py-2 px-4 rounded-md hover:bg-emerald-700 transition text-sm font-medium">
                    音声読み上げ
                </button>
                <button id="saveFirebaseBtn" onclick="saveToFirebase()" class="bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition text-sm font-medium">
                    Firebaseに保存
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs (Compat versions for simple integration) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        // Firebase 設定プレースホルダー（必要に応じて書き換えてください）
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_FIREBASE_AUTH_DOMAIN",
            projectId: "YOUR_FIREBASE_PROJECT_ID",
            storageBucket: "YOUR_FIREBASE_STORAGE_BUCKET",
            messagingSenderId: "YOUR_FIREBASE_MESSAGING_SENDER_ID",
            appId: "YOUR_FIREBASE_APP_ID"
        };

        // Firebase初期化の安全なガード
        let db = null;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
        } catch (e) {
            console.warn("Firebase initialization skipped or failed:", e);
        }

        let rawMarkdownText = ""; // 蓄積された生テキスト

        // マークダウン記号除去フィルタ（音声読み上げ用などに利用可能）
        function cleanMarkdown(text) {
            return text
                .replace(/```[\s\S]*?```/g, '') // コードブロック削除
                .replace(/`([^`]+)`/g, '$1')     // インラインコード削除
                .replace(/[#*_~`>-]/g, '')       // マークダウンの特殊記号削除
                .replace(/\n+/g, ' ');           // 改行をスペースに置換
        }

        async function startEvaluation() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const question = document.getElementById('question').value.trim();
            const answer = document.getElementById('answer').value.trim();
            const statusIndicator = document.getElementById('statusIndicator');
            const resultContainer = document.getElementById('resultContainer');
            const resultContent = document.getElementById('resultContent');

            if (!apiKey) {
                alert('Gemini API Keyを入力してください。');
                return;
            }
            if (!question || !answer) {
                alert('問題文と解答の両方を入力してください。');
                return;
            }

            // UIリセット
            statusIndicator.classList.remove('hidden');
            resultContainer.classList.remove('hidden');
            resultContent.innerHTML = '';
            rawMarkdownText = "";

            // プロンプトの構築
            const promptText = `以下の問題と解答を採点し、点数（100点満点）と詳細な解説、改善点をマークダウン形式で出力してください。\n\n【問題】\n${question}\n\n【解答】\n${answer}`;

            const requestBody = {
                contents: [{
                    parts: [{ text: promptText }]
                }]
            };

            // 要件1: エンドポイントに ?alt=sse を確実に付与
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:streamGenerateContent?alt=sse&key=${apiKey}`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const errorData = await response.text();
                    throw new Error(`API Error: ${response.status} ${errorData}`);
                }

                if (!response.body) {
                    throw new Error('ReadableStream not supported on response.body.');
                }

                // 要件2: response.body.getReader() と TextDecoder によるリアルタイムストリーミング処理
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    
                    // 最後の不完全な行は次回のチャンクに持ち越す
                    buffer = lines.pop() || "";

                    for (const line of lines) {
                        const trimmedLine = line.trim();
                        if (trimmedLine.startsWith('data:')) {
                            const jsonStr = trimmedLine.replace(/^data:\s*/, '');
                            if (jsonStr === '[DONE]') continue;

                            try {
                                const data = JSON.parse(jsonStr);
                                const textChunk = data.candidates?.[0]?.content?.parts?.[0]?.text;
                                
                                if (textChunk) {
                                    rawMarkdownText += textChunk;
                                    // 要件2・3: 即座に画面上の表示用要素に逐次追記し、Markdownパースを適用
                                    resultContent.innerHTML = marked.parse(rawMarkdownText);
                                }
                            } catch (err) {
                                console.warn('JSON Parse error for line:', jsonStr, err);
                            }
                        }
                    }
                }

            } catch (error) {
                console.error(error);
                resultContent.innerHTML = `<span class="text-red-500">エラーが発生しました: ${error.message}</span>`;
            } finally {
                // ローディング非表示
                statusIndicator.classList.add('hidden');
            }
        }

        // Web Speech API による音声読み上げ機能（既存維持）
        let isSpeaking = false;
        function toggleSpeech() {
            if (!('speechSynthesis' in window)) {
                alert('お使いのブラウザは音声読み上げに対応していません。');
                return;
            }

            const speakBtn = document.getElementById('speakBtn');

            if (isSpeaking) {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                speakBtn.textContent = '音声読み上げ';
                return;
            }

            if (!rawMarkdownText) {
                alert('読み上げるテキストがありません。');
                return;
            }

            const cleanText = cleanMarkdown(rawMarkdownText);
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'ja-JP';

            utterance.onend = () => {
                isSpeaking = false;
                speakBtn.textContent = '音声読み上げ';
            };

            utterance.onerror = () => {
                isSpeaking = false;
                speakBtn.textContent = '音声読み上げ';
            };

            isSpeaking = true;
            speakBtn.textContent = '読み上げ停止';
            window.speechSynthesis.speak(utterance);
        }

        // Firebase 連携機能（既存維持）
        async function saveToFirebase() {
            if (!db) {
                alert('Firebaseが初期化されていないか、設定が無効です。');
                return;
            }
            const question = document.getElementById('question').value.trim();
            const answer = document.getElementById('answer').value.trim();

            if (!rawMarkdownText) {
                alert('保存する採点結果がありません。');
                return;
            }

            try {
                await db.collection('evaluations').add({
                    question: question,
                    answer: answer,
                    evaluation: rawMarkdownText,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert('Firebaseに正常に保存されました！');
            } catch (error) {
                console.error('Firebase保存エラー:', error);
                alert('保存に失敗しました: ' + error.message);
            }
        }
    </script>
</body>
</html>
